name: CI

# Both jobs run on every pull request and on pushes to main and dev.
#
# They are NOT required checks. `dev` has no branch protection rule and the repo
# has no rulesets, so a red CI run does not stop a merge — it is a signal a human
# has to look at, not a gate. Making either job required is a repository settings
# change (Settings → Branches, or a ruleset) that has not been done.

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fake values only — never real secrets. Both jobs override DATABASE_URL with
  # a real service container (see each job), because both of them render pages
  # that read Payload. R2 is never contacted: the fixtures create no uploads.
  PAYLOAD_SECRET: ci-dummy-secret-not-a-real-secret-0123456789
  R2_ACCOUNT_ID: dummy-account-id
  R2_ACCESS_KEY_ID: dummy-access-key
  R2_SECRET_ACCESS_KEY: dummy-secret-key
  R2_BUCKET: svef-assets-ci
  R2_PUBLIC_URL: https://assets.example.com
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # `next build` needs a real database (#58).
    #
    # Pages under `app/(app)/[locale]` are prerendered, and prerendering a page
    # that reads Payload means connecting to Postgres at build time. Building
    # against a placeholder DATABASE_URL left exactly one escape: marking the
    # route `dynamic = 'force-dynamic'` so it is never prerendered — which
    # bought a green build by turning every visit into a function invocation.
    #
    # Same service container as the `e2e` job below, same `npm run seed:dev`,
    # same fixtures a maintainer sees locally. The build is now a real check on
    # the queries the pages make, not just on whether they compile.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: svef
          POSTGRES_PASSWORD: svef
          POSTGRES_DB: svef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://svef:svef@localhost:5432/svef
      DATABASE_URL_UNPOOLED: postgresql://svef:svef@localhost:5432/svef

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Seed development fixtures
        run: npm run seed:dev

      - name: Build
        run: npm run build

      # Proof, not assertion: the build only reaches `●` for these routes if it
      # actually read rows. A build against a dead database would either fail or
      # silently fall back to a dynamic route, and both show up here.
      - name: Show prerendered news routes
        run: |
          echo "Prerendered /frettir pages:"
          find .next/server/app -path '*frettir*' -name '*.html' | sort

  e2e:
    name: Playwright e2e + axe
    runs-on: ubuntu-latest

    # A Postgres service container plus `npm run seed:dev`, which keeps the job
    # self-contained: no preview URL to wait for, and the same fixtures a
    # maintainer sees locally.
    #
    # This is now genuinely load-bearing: #24 wired `/frettir` and the article
    # route to Payload, so the news sweeps, the link integrity check and
    # `article.spec.ts` all read real rows. `npm run seed:dev` and
    # `e2e/payload-api.spec.ts` depend on it too.
    #
    # The other pages still render from hard-coded dictionaries and would pass
    # against a dead database — worth knowing before assuming the whole suite
    # covers the CMS.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: svef
          POSTGRES_PASSWORD: svef
          POSTGRES_DB: svef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://svef:svef@localhost:5432/svef
      DATABASE_URL_UNPOOLED: postgresql://svef:svef@localhost:5432/svef
      PLAYWRIGHT_PORT: 3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed development fixtures
        run: npm run seed:dev

      # `playwright.config.ts` builds the app and starts it on PLAYWRIGHT_PORT.
      - name: Run e2e + axe sweeps
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
