name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fake values only — never real secrets. next build loads the Payload config,
  # which requires these to be present, but the build never actually connects
  # to the database or to R2.
  DATABASE_URL: postgresql://user:pass@localhost:5432/svef
  PAYLOAD_SECRET: ci-dummy-secret-not-a-real-secret-0123456789
  R2_ACCOUNT_ID: dummy-account-id
  R2_ACCESS_KEY_ID: dummy-access-key
  R2_SECRET_ACCESS_KEY: dummy-secret-key
  R2_BUCKET: svef-assets-ci
  R2_PUBLIC_URL: https://assets.example.com
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
